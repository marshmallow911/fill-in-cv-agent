[project]
name = "browseragent"
version = "0.1.0"
description = "A privacy-aware CLI agent that fills job application forms without submitting them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "browser-use>=0.13.7",
    "langchain>=1.3.14",
    "langgraph>=1.2.10",
    "python-dotenv>=1.2.2",
]

[project.scripts]
browseragent = "browseragent.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
